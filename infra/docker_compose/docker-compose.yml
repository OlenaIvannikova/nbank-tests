services:
  backend:
    image: nobugsme/nbank:with_database_with_fix
    # container_name: nbank-app
    # явно добавили соответствие host.docker.internal адресу хоста
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    ports:
      - "4111:4111"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/nbank
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      # Backend работает внутри Docker-контейнера, а WireMock запущен на хост-машине.
      # host.docker.internal позволяет контейнеру обратиться к хосту, на котором работает Docker.
      # Когда backend выполняет запрос к Fraud Detection Service,
      # он обращается по адресу из переменной окружения и попадает в WireMock.
      # - FRAUD_DETECTION_SERVICE_URL=http://host.docker.internal:9090
    depends_on:
      - postgres
    networks:
      - nbank-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4111/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - nbank-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d nbank" ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: nobugsme/nbank-ui:with_nginx
    ports:
      - "3000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - nbank-network

  selenoid:
    image: aerokube/selenoid:latest
    ports:
      - "4444:4444"
    environment:
      - DOCKER_API_VERSION=1.45
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../selenoid/config/:/etc/selenoid/:ro
    command: [ "-container-network", "nbank-network" ]
    depends_on:
      - frontend
    networks:
      - nbank-network
 
  selenoid-ui:
    image: aerokube/selenoid-ui:latest
    ports:
      - "8080:8080"
    environment:
      - DOCKER_API_VERSION=1.45
    command: [ "--selenoid-uri", "http://selenoid:4444" ]
    depends_on:
      - selenoid
    networks:
      - nbank-network

networks:
  nbank-network:
    name: nbank-network

volumes:
  postgres_data:
    driver: local




