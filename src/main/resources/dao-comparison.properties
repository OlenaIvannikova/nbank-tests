# Format: ApiResponseClass=DaoClass:field1=field1Dao,field2=field2Dao
# Maps API response fields to DAO fields for comparison
UserResponse=UserDao:username=username,role=role,id=id,name=name
AccountResponse=AccountDao:accountNumber=accountNumber,id=id,balance=balance
DepositRequest=TransactionDao:id=relatedAccountId,balance=amount
Transaction=TransactionDao:id=id,amount=amount,type=type,relatedAccountId=relatedAccountId
