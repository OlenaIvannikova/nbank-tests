name: Build and Push Tests Image

on:
  push:
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build, Test, Checkstyle and Push
    runs-on: ubuntu-latest

    steps:
      # Копируем файлы репозитория внутрь CI агента
      - name: Checkout repository
        uses: actions/checkout@v4

      # Устанавливаем Java
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      # Кэшируем Maven-зависимости
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Поднимаем инфраструктуру
      - name: Set up services
        run: bash restart_docker.sh
        working-directory: infra/docker_compose

      # Собираем проект, запускаем тесты и Checkstyle
      - name: Build, run tests and checkstyle
        run: |
          chmod +x ./mvnw
          ./mvnw clean verify
        env:
          APIBASEURL: http://localhost:4111
          UIBASEURL: http://frontend
          UIREMOTE: http://localhost:4444/wd/hub
          DB_URL: jdbc:postgresql://localhost:5433/nbank
          DB_LOGIN: ${{ secrets.POSTGRES_USER }}
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      # Останавливаем инфраструктуру
      - name: Stop services
        if: always()
        run: docker compose down
        working-directory: infra/docker_compose

      # Настраиваем Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Авторизуемся в Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Собираем и отправляем Docker-образ
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nbank-tests:${{ github.sha }}